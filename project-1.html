<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT</title>
    <link rel="stylesheet" href="project-1.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <h2>Currency Converter</h2>
    <div class="amount">
        <p class="amount-holder" >Enter Amount</p>
        <input type="text" placeholder="Enter possitive amount" >
    </div>
    <div class="dropdown">
        <div class="from">
            <p class="from-to">From</p>
            <div class="select-box">
                 <img src="https://flagsapi.com/US/flat/64.png" alt="not found">
                <select>
                    <option>USD</option>
                    <option>INR</option>
                    <option>EUR</option>
                    <option>AUD</option>
                </select>
            </div>
        </div>
<i class="fa-solid fa-arrow-right-arrow-left"></i>
        <div class="to">
            <p class="from-to">To</p>
            <div class="select-box">
                <img src="https://flagsapi.com/IN/flat/64.png" alt="not found">
                <select>
                    <option>USD</option>
                    <option selected>INR</option>
                    <option>EUR</option>
                    <option>AUD</option>
                </select>
            </div>
        </div>
     </div>
    
    <div class="msg">
    </div>
    <button class="Eclick">Exchange Rate</button>
    </div>
    <script src="project-1-flag.js"></script>
    <script src="project-1.js"></script>
</body>
</html>
